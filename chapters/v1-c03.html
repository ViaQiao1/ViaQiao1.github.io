    <h3>第三章：羁绊</h3>
    <p>相遇之后，是漫长的相处。他们一起走过山川，一起看过星辰，一起经历着生活中的点点滴滴。每一次微笑，每一次对视，都在加深着他们之间的羁绊。</p>
    <p>羁绊，是纯爱宇宙中最珍贵的东西。它不是简单的情感，而是灵魂深处的连接，是无论相隔多远都能感受到的温暖。</p>
    <p>"我会一直在你身边，"他坚定地说，"无论发生什么。"</p>
    <p>她微笑着点头，眼中闪烁着泪光。这就是爱，简单而纯粹，却蕴含着无穷的力量。</p>
