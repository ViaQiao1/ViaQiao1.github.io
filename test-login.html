<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试登录</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #fdf6f9;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            text-align: center;
            width: 300px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #e8a4c9;
            border-radius: 8px;
            font-size: 18px;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #e8a4c9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #d88fb0;
        }
        .error {
            color: red;
            display: none;
        }
        .success {
            color: green;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>测试登录</h2>
        <p>输入密码 1010</p>
        <input type="password" id="pwd" placeholder="密码">
        <button onclick="check()">登录</button>
        <div class="error" id="err">密码错误！</div>
        <div class="success" id="succ">登录成功！</div>
    </div>

    <script>
        function check() {
            var pwd = document.getElementById('pwd');
            var err = document.getElementById('err');
            var succ = document.getElementById('succ');
            
            if (pwd.value === '1010') {
                err.style.display = 'none';
                succ.style.display = 'block';
                alert('登录成功！');
            } else {
                succ.style.display = 'none';
                err.style.display = 'block';
                pwd.value = '';
            }
        }
        
        document.getElementById('pwd').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                check();
            }
        });
    </script>
</body>
</html>
